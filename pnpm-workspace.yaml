packages:
  - components/*
  - components/app/*
  - packages/*

catalog:
  katex: 0.19.0

overrides:
  # Keep rehype-katex's renderer aligned with the blog's stylesheet.
  rehype-katex>katex: 'catalog:'

allowBuilds:
  esbuild: true
  sharp: true
minimumReleaseAgeExclude:
  - '@astrojs/internal-helpers@0.12.0'
  - '@astrojs/markdown-satteri@0.4.3'
  - astro@7.3.6
  - '@astrojs/markdown-remark@7.3.2'
